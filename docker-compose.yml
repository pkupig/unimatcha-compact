services:
  postgres:
    image: postgres:16-alpine
    container_name: unimatcha_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campuslove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuslove_secret}
      POSTGRES_DB: ${POSTGRES_DB:-campuslove}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuslove}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unimatcha_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: unimatcha-api
    container_name: unimatcha_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-campuslove}:${POSTGRES_PASSWORD:-campuslove_secret}@postgres:5432/${POSTGRES_DB:-campuslove}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change_this_admin_jwt_secret}
      ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN:-8h}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@campuslove.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123456}
      PORT: 3001
      NODE_ENV: production
    # Behind Caddy: reachable on the internal network + via api.<domain>.
    # (was "3001:3001" — switch back to `ports` if you need direct host access.)
    expose:
      - "3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    image: unimatcha-admin-web
    container_name: unimatcha_admin
    environment:
      # In production point these at the public domain, e.g.
      #   NEXT_PUBLIC_API_URL=https://api.unimatcha.com
      #   NEXTAUTH_URL=https://admin.unimatcha.com
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_this_secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    # Behind Caddy → admin.<domain>. (was "3000:3000")
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  h5:
    build:
      context: ./apps/h5
      dockerfile: Dockerfile
    image: unimatcha-h5
    container_name: unimatcha_h5
    # Behind Caddy → app.<domain>. (was "3002:80")
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: unimatcha-web
    container_name: unimatcha_web
    # Marketing site, behind Caddy → root domain (unimatcha.com).
    expose:
      - "3003"
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: unimatcha_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - admin-web
      - h5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
