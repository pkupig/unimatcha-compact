services:
  postgres:
    image: postgres:16-alpine
    container_name: campus_love_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campuslove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuslove_secret}
      POSTGRES_DB: ${POSTGRES_DB:-campuslove}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuslove}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campus_love_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: campus_love_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-campuslove}:${POSTGRES_PASSWORD:-campuslove_secret}@postgres:5432/${POSTGRES_DB:-campuslove}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change_this_admin_jwt_secret}
      ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN:-8h}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@campuslove.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123456}
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    container_name: campus_love_admin
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_this_secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  h5:
    build:
      context: ./apps/h5
      dockerfile: Dockerfile
    container_name: campus_love_h5
    ports:
      - "3002:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
