services:
  postgres:
    image: postgres:16-alpine
    container_name: unimatcha_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campuslove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuslove_secret}
      POSTGRES_DB: ${POSTGRES_DB:-campuslove}
    # 只绑回环：api 走 docker 内网 postgres:5432 连接，无需把 DB 暴露到公网。
    # "5432:5432" 会监听 0.0.0.0（公网可达）；"127.0.0.1:5432" 仅本机可连（保留本地开发直连）。
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuslove}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unimatcha_redis
    # 只绑回环：Redis 无鉴权，"6379:6379" 会把它暴露到公网（任何人可读写/FLUSHALL）。
    # api 走内网 redis:6379 连接，故仅绑 127.0.0.1（保留本地开发直连）。
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: unimatcha-api
    container_name: unimatcha_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-campuslove}:${POSTGRES_PASSWORD:-campuslove_secret}@postgres:5432/${POSTGRES_DB:-campuslove}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change_this_admin_jwt_secret}
      ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN:-8h}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@campuslove.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123456}
      PORT: 3001
      NODE_ENV: production
      # 匹配模型（BACKLOG P0-1）：设了 AI_PROVIDER_URL 即用 matching-ml；MATCH_MODEL=scoring 可一行回退。
      # AI_PROVIDER_API_KEY 必须与 matching-ml 的 MATCH_API_KEY 一致。演示数据默认关闭（SEED_DEMO）。
      MATCH_MODEL: ${MATCH_MODEL:-ai}
      AI_PROVIDER_URL: ${AI_PROVIDER_URL:-http://matching-ml:8100/match}
      AI_PROVIDER_API_KEY: ${MATCH_API_KEY:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    # Behind Caddy: reachable on the internal network + via api.<domain>.
    # (was "3001:3001" — switch back to `ports` if you need direct host access.)
    expose:
      - "3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      matching-ml:
        condition: service_started
    restart: unless-stopped

  matching-ml:
    build:
      context: ./matching-ml
      dockerfile: Dockerfile
    image: unimatcha-matching-ml
    container_name: unimatcha_matching_ml
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-mock}
      # 生产必设：空 key + 非回环绑定会 fail-closed 拒绝启动（P0-5）。与后端 AI_PROVIDER_API_KEY 一致。
      MATCH_API_KEY: ${MATCH_API_KEY:-}
      HOST: 0.0.0.0
      PORT: 8100
    # 仅内网可达（api 走 matching-ml:8100）；不经 Caddy 暴露到公网。
    expose:
      - "8100"
    restart: unless-stopped

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_API_URL 必须在 build 时传入（客户端包编译期内联）；生产设成 https://api.<域名>。
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
    image: unimatcha-admin-web
    container_name: unimatcha_admin
    environment:
      # NEXTAUTH_* 是运行时用；NEXT_PUBLIC_API_URL 已在上面 build args 内联，这里不再重复（运行时设无效）。
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_this_secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    # Behind Caddy → admin.<domain>. (was "3000:3000")
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  h5:
    build:
      context: ./apps/h5
      dockerfile: Dockerfile
    image: unimatcha-h5
    container_name: unimatcha_h5
    # Behind Caddy → app.<domain>. (was "3002:80")
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: unimatcha-web
    container_name: unimatcha_web
    # Marketing site, behind Caddy → root domain (unimatcha.com).
    expose:
      - "3003"
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: unimatcha_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - admin-web
      - h5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
