    <div class="faq-group" id="g-account">
      <div class="faq-cat" style="margin-top:0"><span class="dot"></span><span data-zh="账号与认证" data-en="ACCOUNT &amp; VERIFICATION"></span></div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="注册需要什么？" data-en="What do I need to sign up?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="一个有效的校园邮箱（.edu 或同等学校邮箱）和密码。注册后完善资料即可使用校园墙；进入匹配前还需完成对应模式的问卷。" data-en="A valid university email (.edu or equivalent) and a password. Fill in your profile to use the campus wall; complete the mode's questionnaire before entering matching."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="忘记密码怎么办？" data-en="Forgot my password?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="在登录页点击「忘记密码」按提示操作；遇到问题可发邮件到 contact@unimatcha.ai，我们帮你处理。" data-en="Use “Forgot Password” on the sign-in page. If anything goes wrong, email contact@unimatcha.ai and we'll sort it out."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="换学校 / 毕业了怎么办？" data-en="Changed school or graduated?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="学校信息与认证绑定，暂不支持自助修改。发邮件联系我们更新学校信息。" data-en="School info is tied to verification and can't be self-edited yet. Email us and we'll update it for you."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="可以不参加匹配、只用校园墙吗？" data-en="Can I just use the campus wall without matching?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="当然可以。注册完善资料后即可使用校园墙和广场；问卷只在你想进入匹配时才需要填。" data-en="Absolutely. Once registered you can use the campus wall and square right away — the questionnaire is only needed when you want to enter matching."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="别人能看到我的哪些资料？" data-en="What can others see on my profile?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="昵称、头像、学校和你选择公开的兴趣标签等。真实姓名仅对已确认的伴侣或好友可见，匹配之前没人能看到。" data-en="Nickname, avatar, school and the interests you choose to show. Your real name is visible only to confirmed partners or friends — never before."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="如何注销账号？" data-en="How do I delete my account?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="在应用内「设置」中申请注销，我们会在 30 天内删除你的个人信息（法律要求保留的除外），详见《隐私协议》。" data-en="Request deletion in Settings. Personal data is erased within 30 days (except legally required retention) — see the Privacy Policy."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="一个人可以注册多个账号吗？" data-en="Can one person have multiple accounts?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="不可以，一人一号。批量注册和小号会被风控识别并处理——认真社区从真实的「一个你」开始。" data-en="No — one person, one account. Bulk sign-ups and alt accounts are detected and actioned. A serious community starts with one real you."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="收不到验证或通知邮件怎么办？" data-en="Not receiving verification or notification emails?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="先检查垃圾邮件/订阅文件夹，并确认学校邮箱没有对外部邮件设限。仍收不到就联系 contact@unimatcha.ai，我们人工处理。" data-en="Check spam/junk first, and make sure your university inbox allows external mail. Still nothing? Email contact@unimatcha.ai and we'll sort it manually."></p></div></div>
      </div>
    </div>

    <div class="faq-group" id="g-matching">
      <div class="faq-cat"><span class="dot"></span><span data-zh="匹配与轮次" data-en="MATCHING &amp; ROUNDS"></span></div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="匹配结果什么时候公布？" data-en="When are match results revealed?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="每周五 17:00 统一公布。加入本周匹配池后，算法会用一整周为你优化，到点一起揭晓。" data-en="Every Friday at 17:00, all at once. Join the week's pool and the algorithm optimises for you all week until the reveal."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="恋人模式和朋友模式有什么区别？" data-en="Romantic vs Friend mode?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="恋人模式为你匹配一位最合适的人，确认后进入恋人关系；朋友模式一轮最多给出 5 位候选，逐个确认成为好友。两种模式的问卷和偏好是分开的。" data-en="Romantic mode matches you with one best-fit person; confirming starts a relationship. Friend mode offers up to 5 candidates per round, confirmed one by one. Questionnaires and preferences are separate per mode."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="这一轮没匹配到怎么办？" data-en="What if I don't get matched this round?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="很正常——我们宁缺毋滥。下一轮重新加入即可；若开启了增强匹配，未匹配时预扣的能量会按规则退还。" data-en="It happens — we'd rather match nobody than the wrong body. Just join the next round; if you enabled enhanced matching, the reserved energy is refunded per the rules when no match is made."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="可以中途离开匹配池吗？" data-en="Can I leave the pool mid-round?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="可以。在匹配页点「离开匹配池」，公布前随时可退，之后想参加再一键加入。" data-en="Yes. Tap “Leave Pool” on the matching screen any time before the reveal, and rejoin whenever you like."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="为什么看不到匹配分数？" data-en="Why is there no match score?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="因为人不该被打分。我们展示的是匹配理由——你们为什么合适，而不是一个冷冰冰的数字。" data-en="Because people shouldn't be scored. We show match reasons — why you fit — not a cold number."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="确认之后会发生什么？" data-en="What happens after confirming?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="恋人模式确认后进入恋人关系并解锁专属聊天；朋友模式逐个确认候选成为好友，同样解锁聊天。第一句话由匹配理由自然开场，不必尬聊。" data-en="Confirming in Romantic mode starts a relationship and unlocks chat; in Friend mode you confirm candidates one by one. The match reasons make a natural opener — no awkward icebreakers."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="匹配到了但不想确认怎么办？" data-en="Matched but not feeling it?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="没关系，确认永远是自愿的。不确认的候选到期自动失效；已确认的关系也可以随时解除。你的选择不会被对方以外的任何人知道。" data-en="That's fine — confirming is always voluntary. Unconfirmed candidates simply expire, and confirmed relationships can be ended anytime. Your choice is never shown to anyone but the other person."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="能优先匹配同校 / 同城的人吗？" data-en="Can I prefer same-school / same-city matches?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="可以。在匹配设置里可以设定性别、年龄范围、同校、同城等偏好，算法会按你的偏好筛选候选。" data-en="Yes — set gender, age range, same-school and same-city preferences in Match Settings, and the algorithm filters candidates accordingly."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="可以同时参加恋人和朋友匹配吗？" data-en="Can I do Romantic and Friend matching at the same time?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="可以。两种模式相互独立：问卷、偏好、匹配池都分开，互不影响。" data-en="Yes. The two modes are fully independent — separate questionnaires, preferences and pools."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="周五公布时没在线会错过吗？" data-en="What if I'm offline at Friday's reveal?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="不会错过结果——匹配结果会保留在应用里，随时进去都能看。但注意候选确认有时限，过期未确认会自动失效，所以别放太久。" data-en="You won't miss the result — it stays in the app. But confirmations have a time limit; unconfirmed candidates expire, so don't leave it too long."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="解除关系之后还能再参加匹配吗？" data-en="Can I match again after ending a relationship?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="可以。解除后你可以在下一轮重新加入匹配池，一切从头开始——认真结束也是认真的一部分。" data-en="Yes — rejoin the pool next round and start fresh. Ending things properly is part of being serious too."></p></div></div>
      </div>
    </div>

    <div class="faq-group" id="g-wall">
      <div class="faq-cat"><span class="dot"></span><span data-zh="校园墙与匿名" data-en="CAMPUS WALL &amp; ANONYMITY"></span></div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="匿名发帖，别人能知道是我吗？" data-en="Can anyone tell an anonymous post is mine?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="不能。匿名内容以随机化名展示，评论和点赞的通知也用化名——包括楼主在内，没有用户能反推你是谁。" data-en="No. Anonymous content shows a random pseudonym, and comment/like notifications use pseudonyms too — no user, including the post author, can trace it back to you."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="可以删除自己发的内容吗？" data-en="Can I delete my own content?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="可以，自己发布的帖子和评论都可以随时删除。" data-en="Yes — your own posts and comments can be deleted at any time."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="能看到别的学校的内容吗？" data-en="Can I see other campuses' posts?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="校园墙以本校为中心；推荐流会出现跨校的优质内容，让你也能遇见其他校园的有趣灵魂。" data-en="The campus wall centres on your own school; the Recommend feed surfaces great cross-campus content too."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="发帖可以带图片吗？" data-en="Can posts include images?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="可以，帖子支持配图。图片同样经过安全审核，违规图片会被拦截。" data-en="Yes, posts support images. Images go through the same safety review; violating ones are blocked."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="有人能把化名和我拼起来吗？" data-en="Can pseudonyms be pieced back to me?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="不能。化名与真实身份之间没有任何用户可见的关联，评论和点赞通知也走化名，系统里存储的是不可反推的匿名标识。" data-en="No. There is no user-visible link between pseudonyms and real identities; notifications use pseudonyms too, and the system stores untraceable anonymous tokens."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="我的帖子被下架了怎么办？" data-en="My post was taken down — now what?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="下架会伴随通知说明原因。如果你认为是误判，回复邮件 contact@unimatcha.ai 申诉，我们会复核。" data-en="Takedowns come with a notification explaining why. If you think it's a mistake, appeal via contact@unimatcha.ai and we'll re-review."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="发帖有字数限制吗？" data-en="Is there a length limit on posts?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="有：标题最多 100 字，正文最多 2000 字。评论同样有合理长度限制，够你把事说清楚。" data-en="Yes: titles up to 100 characters, body up to 2,000. Comments have sensible limits too — plenty to make your point."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="信息流里标注 SPONSORED 的内容是什么？" data-en="What are the posts marked SPONSORED?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="那是面向你所在校园的赞助内容。每一条都先经过你学校学生会的审核，并且始终带明确标注，绝不伪装成普通帖子。" data-en="Campus-targeted sponsored content. Every ad is reviewed by your school's student union first and always clearly labelled — never disguised as a regular post."></p></div></div>
      </div>
    </div>

    <div class="faq-group" id="g-energy">
      <div class="faq-cat"><span class="dot"></span><span data-zh="能量与增强" data-en="ENERGY &amp; ENHANCED"></span></div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="能量是什么？" data-en="What is Energy?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="能量是应用内的资源，按格计，用于开启增强匹配等进阶能力。可在「我的 → ENERGY」查看和获取。" data-en="Energy is an in-app resource, counted in cells, used for advanced features like enhanced matching. Check and top up under Profile → ENERGY."></p></div></div>
      </div>
      <div class="faq-item">
        <button class="faq-q" type="button"><span data-zh="增强匹配是做什么的？" data-en="What does enhanced matching do?"></span><span class="material-symbols-rounded faq-ic">expand_more</span></button>
        <div class="faq-a"><div><p data-zh="扩大候选范围并提高优先级。恋人模式固定消耗 3 格能量；朋友模式按你选择的格数（1–5 格，对应希望匹配的朋友数）。增强按轮次生效，每轮单独开启。" data-en="It widens your candidate pool and raises priority. Romantic mode costs a fixed 3 cells; Friend mode costs the cells you choose (1–5, matching the number of friends you want). Enhanced applies per round."></p></div></div>
      </div>
      <div class="faq-item">

        <div class="faq-a"><div><p data-zh="会。增强匹配预扣的能量，在本轮未匹配成功或候选过期未确认时，按规则自动退还。" data-en="Yes. Energy reserved for enhanced matching is automatically refunded per the rules if no match is made this round or candidates expire unconfirmed."></p></div></div>

        <div class="faq-a"><div><p data-zh="在应用内「我的 → ENERGY」查看余额和获取入口。能量是虚拟资源，不可提现、不可转让。" data-en="Check your balance and top-up options under Profile → ENERGY. Energy is a virtual resource — not withdrawable or transferable."></p></div></div>
