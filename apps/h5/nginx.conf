server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的构建产物：一年不变缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 图标等静态资源：一天
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # 入口与非哈希页面：no-store 彻底禁止存储（no-cache 只要求回源验证，
    # iOS 主屏 PWA/微信内置浏览器实践中仍会顽固复用存储副本——用户实测
    # 冷启动都拿不到新版；no-store 让客户端根本没有旧副本可用）
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /loaders.html { add_header Cache-Control "no-store"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-store"; }

    # SPA 回退
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
