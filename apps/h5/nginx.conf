server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的构建产物：一年不变缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 图标等静态资源：一天
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # 入口与非哈希页面：禁缓存（否则手机按启发式缓存旧版，改版不可见）
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /loaders.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache, must-revalidate"; }

    # SPA 回退
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
